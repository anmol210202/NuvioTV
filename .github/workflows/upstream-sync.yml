name: Upstream Sync

on:
  schedule:
    - cron: '0 3 * * *' # Run daily at 03:00 UTC
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  issues: write

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for merging

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioTV.git
          git fetch upstream main

      - name: Merge upstream
        id: merge
        run: |
          # Try to merge without opening an editor
          if git merge upstream/main --no-edit; then
            echo "Merge successful"
            echo "merge_status=success" >> $GITHUB_OUTPUT
            git push origin main
          else
            echo "Merge conflicts detected"
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            git merge --abort
          fi

      - name: Create Issue on Conflict
        if: steps.merge.outputs.merge_status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Upstream Sync Merge Conflict',
              body: 'The scheduled upstream sync failed due to merge conflicts. Please pull the latest `main` branch, merge `upstream/main` locally, resolve the conflicts, and push the changes back.',
            })
